# Render Blueprint for the Pydantic AI context-gate API.
# Render dashboard > New > Blueprint > pick this repo. You'll be asked for ANTHROPIC_API_KEY.
services:
  - type: web
    name: incident-context-gate-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: PYDANTIC_AI_NO_BANNER
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL
        value: anthropic:claude-sonnet-5-5
      - key: RATE_LIMIT_PER_10_MIN
        value: "20"
